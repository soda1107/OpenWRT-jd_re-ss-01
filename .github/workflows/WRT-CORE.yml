#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: false
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: boolean
        default: false
      CI_NAME:
        required: false
        type: string
      WRT_ARCH:
        required: false
        type: string

permissions:
  contents: write
  actions: write

env:
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_DIR: 'wrt'
  CI_NAME: ${{inputs.CI_NAME}}
  WRT_ARCH: ${{inputs.WRT_ARCH}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Install BC
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq install bc

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/share/chromium /usr/local/share/powershell"
          testing: false

      - name: Checkout Projects
        uses: actions/checkout@v7
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          dos2unix "$GITHUB_WORKSPACE/Scripts/init_build_environment.sh"
          sudo bash "$GITHUB_WORKSPACE/Scripts/init_build_environment.sh"
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
#          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
#          sudo mkdir -p /mnt/build_wrt
#          sudo chown $USER:$USER /mnt/build_wrt
#          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - run: go version

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

          [[ -z $WRT_ARCH ]] && {
            export WRT_ARCH=$(sed -n 's/.*_DEVICE_\(.*\)_DEVICE_.*/\1/p' $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt | head -n 1)
            echo "WRT_ARCH=$WRT_ARCH" >> $GITHUB_ENV
          }
          echo "$WRT_REPO/$WRT_BRANCH" > "$GITHUB_WORKSPACE/repo_flag"
      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          #剔除源码树内置的国内镜像源，避免个别镜像异常时拖慢或打断 downloads
          PROJECT_MIRRORS_FILE="./wrt/scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/\.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          . $GITHUB_WORKSPACE/Scripts/function.sh
          cd ./wrt/

          generate_config && cat .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc)

          bash $GITHUB_WORKSPACE/Scripts/AssertConfig.sh

      - name: Cache Wrt Build - 下载缓存（dl，与 commit 无关）
        id: cache-dl
        uses: actions/cache@v4
        with:
          path: |
            wrt/dl/
          key: dl-${{ env.WRT_ARCH }}-${{ hashFiles('Config/*.txt', 'Scripts/Packages.sh') }}
          restore-keys: |
            dl-${{ env.WRT_ARCH }}-

      - name: Cache Wrt Build - 编译器缓存（ccache，滚动 key）
        id: cache-ccache
        uses: actions/cache@v4
        with:
          path: |
            wrt/.ccache/
          key: ccache-${{ env.WRT_ARCH }}-${{ env.WRT_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ env.WRT_ARCH }}-${{ env.WRT_TARGET }}-

      - name: Cache Wrt Build - 工具链（host/toolchain，随源码 commit 变）
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            wrt/staging_dir/host/
            wrt/staging_dir/toolchain-*/
          key: toolchain-${{ env.WRT_ARCH }}-${{ env.WRT_TARGET }}-${{ env.WRT_BRANCH }}-${{ env.WRT_HASH }}
          restore-keys: |
            toolchain-${{ env.WRT_ARCH }}-${{ env.WRT_TARGET }}-${{ env.WRT_BRANCH }}-

      - name: Cache Wrt Build - 目标包（staging/target + build_dir/target，随配置变）
        id: cache-target
        uses: actions/cache@v4
        with:
          path: |
            wrt/staging_dir/target-*/
            wrt/build_dir/target-*/
          key: ${{ env.WRT_ARCH }}-${{ env.WRT_TARGET }}-${{ env.WRT_BRANCH }}-${{ env.WRT_CONFIG }}-${{ hashFiles('Config/*.txt', 'Scripts/*.sh', 'package/**') }}
          restore-keys: |
            ${{ env.WRT_ARCH }}-${{ env.WRT_TARGET }}-${{ env.WRT_BRANCH }}-${{ env.WRT_CONFIG }}-

      - name: Refresh 工具链 stamp（仅 host/toolchain，排除 target-*，让恢复的工具链被直接复用）
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -mindepth 1 -maxdepth 1 -type d ! -name "target-*" | while read -r dir; do
                find "$dir" -type d -name "stamp" | while read -r s; do
                    find "$s" -type f -exec touch {} +
                done
            done
          fi

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          ok=0
          for i in 1 2 3; do
            if make download -j$(nproc); then ok=1; break; fi
            echo "::warning::make download 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "::error::make download 连续 3 次失败"; exit 1; }

          EMPTY=$(find dl -type f -size 0 2>/dev/null || true)
          if [ -n "$EMPTY" ]; then
            echo "::error::发现 0 字节的下载残留："
            echo "$EMPTY"
            exit 1
          fi

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          set -o pipefail
          make -j$(nproc) 2>&1 | tee ../build.log

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.WRT_CONFIG }}-${{ env.WRT_DATE }}
          path: |
            build.log
            wrt/logs/
            wrt/.config
          retention-days: 7
          if-no-files-found: warn

      - name: Prune Stale Caches
        #成功才清理；正在复用的那份不删
        if: ${{ success() && env.WRT_TEST != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DL_HIT: ${{ steps.cache-dl.outputs.cache-hit }}
          TC_HIT: ${{ steps.cache-toolchain.outputs.cache-hit }}
          TG_HIT: ${{ steps.cache-target.outputs.cache-hit }}
        run: |
          prune() {
            echo "== prune caches with prefix: $1 =="
            gh cache list --key "$1" --limit 100 --json id,key --jq '.[] | "\(.id)\t\(.key)"' \
              | while IFS=$'\t' read -r ID KEY; do
                  [ -n "$ID" ] || continue
                  echo "delete cache: $KEY ($ID)"
                  gh cache delete "$ID" || true
                done
          }

          [ "$DL_HIT" = 'true' ] || prune "dl-$WRT_ARCH-"
          prune "ccache-$WRT_ARCH-$WRT_TARGET-"
          [ "$TC_HIT" = 'true' ] || prune "toolchain-$WRT_ARCH-$WRT_TARGET-$WRT_BRANCH-"
          [ "$TG_HIT" = 'true' ] || prune "$WRT_ARCH-$WRT_TARGET-$WRT_BRANCH-$WRT_CONFIG-"

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="
          echo "=== cache sizes ==="
          du -sh ./dl ./.ccache ./staging_dir ./build_dir 2>/dev/null || true
          echo "=== ccache stats ==="
          ccache -s 2>/dev/null | head -20 || true

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          {
            echo "repo:    $WRT_REPO"
            echo "branch:  $WRT_BRANCH"
            echo "commit:  ${WRT_HASH:-unknown}"
            echo "config:  $WRT_CONFIG"
            echo "target:  $WRT_TARGET"
            echo "date:    $WRT_DATE"
          } > ./upload/BUILD-INFO.txt

          if [ -f ../packages.lock ]; then
            cp -f ../packages.lock ./upload/packages.lock
          fi

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            (
              cd ./upload
              for f in *; do
                [ "$f" = "sha256sums" ] && continue
                [ -f "$f" ] && sha256sum "$f"
              done > sha256sums
            )
          fi

      - name: Release Firmware
        if: env.WRT_TEST != 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{env.CI_NAME}}-${{env.WRT_CONFIG}}_${{env.WRT_DATE}}
          files: ./wrt/upload/*
          body: |
            本固件只包含 Config 中显式选中的设备，请按文件名选择对应设备！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

            附件说明：
            - sha256sums：上传目录内各文件的校验和（改名后重新生成）
            - packages.lock：本次构建所有第三方插件的 commit
            - BUILD-INFO.txt：构建来源（源码/分支/commit/配置/时间）
