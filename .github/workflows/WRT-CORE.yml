name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: false
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: boolean
        default: false
      CI_NAME:
        required: false
        type: string
      WRT_ARCH:
        required: false
        type: string

permissions:
  contents: write
  actions: write

env:
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_DIR: 'wrt'
  CI_NAME: ${{inputs.CI_NAME}}
  WRT_ARCH: ${{inputs.WRT_ARCH}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    # 固定 24.04：上游 init 脚本不支持 26.04
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Install BC
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq install bc

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/share/chromium /usr/local/share/powershell"
          testing: false

      - name: Checkout Projects
        uses: actions/checkout@v7
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev sparse
          sudo bash -c 'set -o pipefail; curl -fsSL --retry 3 --retry-delay 5 https://build-scripts.immortalwrt.org/init_build_environment.sh | bash'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          # 上游脚本无 set -e，缺件不会失败，显式校验
          for tool in clang lld ccache upx upx-ucl padjffs2 po2lmo gh; do
            command -v "$tool" >/dev/null || { echo "::error::init 环境缺少 $tool"; exit 1; }
          done
          if command -v go >/dev/null 2>&1; then
            echo "GO_INSTALLED=true" >> "$GITHUB_ENV"
          fi

      - name: Install Honk Toolchain
        if: env.WRT_TEST != 'true'
        run: |
          # HOME=/root：避免 root 安装过程在 runner 家目录留下 root 属主文件
          # （sudo -E 会保留 HOME=/home/runner，导致后续 cargo zigbuild Permission denied）
          sudo -E env HOME=/root bash "$GITHUB_WORKSPACE/Scripts/InitHonkToolchain.sh"
          # 兜底：恢复 runner 家目录属主（可能有前序步骤以 root 写过）
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache" 2>/dev/null || true
          # 冒烟校验：文件存在不等于可用，提前拦截工具链安装缺陷
          for tool in cargo rustc bpf-linker zig cargo-zigbuild; do
            command -v "$tool" >/dev/null || { echo "::error::honk 工具链缺少 $tool"; exit 1; }
          done
          {
            echo "CARGO_HOME=/usr/local/cargo"
            echo "RUSTUP_HOME=/usr/local/rustup"
          } >> "$GITHUB_ENV"
          echo "/usr/local/cargo/bin" >> "$GITHUB_PATH"

      - name: Setup Go
        if: env.GO_INSTALLED != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - run: go version

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          # 空值守卫：解析失败会让缓存 key 退化、文件筛选匹配全部，必须早失败
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)
          [ -n "$WRT_TARGET" ] || { echo "::error::无法从 Config/$WRT_CONFIG.txt 解析 WRT_TARGET"; exit 1; }
          echo "WRT_TARGET=$WRT_TARGET" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

          [[ -z ${WRT_ARCH:-} ]] && {
            export WRT_ARCH=$(sed -n 's/.*_DEVICE_\(.*\)_DEVICE_.*/\1/p' $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt | head -n 1)
            echo "WRT_ARCH=$WRT_ARCH" >> $GITHUB_ENV
          }
          [ -n "${WRT_ARCH:-}" ] || { echo "::error::WRT_ARCH 为空，无法定位设备"; exit 1; }
          echo "$WRT_REPO/$WRT_BRANCH" > "$GITHUB_WORKSPACE/repo_flag"
      - name: Clone Code
        run: |
          # 幂等守卫：支持 act 本地复现 / workspace 复用时重跑
          rm -rf ./wrt
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          #剔除国内镜像源，避免个别镜像异常时拖慢 downloads
          PROJECT_MIRRORS_FILE="./wrt/scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            # 按条目删除，避免 JSON 尾逗号；jq 失败时保留原文件，不用空 tmp 覆盖
            if jq -e --tab 'del(.[][] | select(test("[.]cn/|tencent|aliyun")))' \
              "$PROJECT_MIRRORS_FILE" > "$PROJECT_MIRRORS_FILE.tmp"; then
              mv -- "$PROJECT_MIRRORS_FILE.tmp" "$PROJECT_MIRRORS_FILE"
            else
              echo "::error::jq 过滤 projectsmirrors.json 失败，保留原文件"
              rm -f "$PROJECT_MIRRORS_FILE.tmp"
              exit 1
            fi
          fi

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          . $GITHUB_WORKSPACE/Scripts/function.sh
          cd ./wrt/

          generate_config && cat .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc)

          bash $GITHUB_WORKSPACE/Scripts/AssertConfig.sh

      - name: Cache Wrt Build - 下载缓存（dl，与 commit 无关）
        id: cache-dl
        if: env.WRT_TEST != 'true'
        uses: actions/cache@v4
        with:
          path: |
            wrt/dl/
          key: dl-${{ env.WRT_ARCH }}-${{ hashFiles('Config/*.txt', 'Scripts/Packages.sh') }}
          restore-keys: |
            dl-${{ env.WRT_ARCH }}-

      - name: Cache Wrt Build - 编译器缓存（ccache，滚动 key）
        id: cache-ccache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@v4
        with:
          path: |
            wrt/.ccache/
          key: ccache-${{ env.WRT_ARCH }}-${{ env.WRT_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ env.WRT_ARCH }}-${{ env.WRT_TARGET }}-

      - name: Cache Wrt Build - 工具链（host/toolchain，随源码 commit 变）
        id: cache-toolchain
        if: env.WRT_TEST != 'true'
        uses: actions/cache@v4
        with:
          path: |
            wrt/staging_dir/host/
            wrt/staging_dir/toolchain-*/
          key: toolchain-${{ env.WRT_ARCH }}-${{ env.WRT_TARGET }}-${{ env.WRT_BRANCH }}-${{ env.WRT_HASH }}
          restore-keys: |
            toolchain-${{ env.WRT_ARCH }}-${{ env.WRT_TARGET }}-${{ env.WRT_BRANCH }}-

      - name: Cache Wrt Build - 目标包（staging/target，随配置变）
        id: cache-target
        if: env.WRT_TEST != 'true'
        uses: actions/cache@v4
        with:
          path: |
            wrt/staging_dir/target-*/
          key: ${{ env.WRT_ARCH }}-${{ env.WRT_TARGET }}-${{ env.WRT_BRANCH }}-${{ env.WRT_CONFIG }}-${{ hashFiles('Config/*.txt', 'Scripts/*.sh', 'package/**') }}
          restore-keys: |
            ${{ env.WRT_ARCH }}-${{ env.WRT_TARGET }}-${{ env.WRT_BRANCH }}-${{ env.WRT_CONFIG }}-

      - name: Refresh 工具链 stamp（来源 commit 一致才刷新，否则让 make 自行重建）
        if: env.WRT_TEST != 'true'
        run: |
          MARKER="./wrt/staging_dir/host/.toolchain-commit"
          CACHED=$(cat "$MARKER" 2>/dev/null || echo "none")
          echo "工具链缓存来源 commit: $CACHED / 当前: ${WRT_HASH:-none}"
          if [ "$CACHED" = "$WRT_HASH" ] && [ -n "$WRT_HASH" ]; then
            echo "来源一致，刷新 stamp 直接复用工具链"
            find "./wrt/staging_dir" -mindepth 1 -maxdepth 1 -type d ! -name "target-*" | while read -r dir; do
                find "$dir" -type d -name "stamp" | while read -r s; do
                    find "$s" -type f -exec touch {} +
                done
            done
          else
            echo "来源不一致或首次构建，不刷新 stamp，由 make 判断是否需要重建工具链"
          fi
          # 写入当前 commit，供本次构建结束时 action 保存进缓存
          mkdir -p "./wrt/staging_dir/host"
          echo "$WRT_HASH" > "$MARKER"

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          ok=0
          for i in 1 2 3; do
            if make download -j$(nproc); then ok=1; break; fi
            echo "::warning::make download 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "::error::make download 连续 3 次失败"; exit 1; }

          #Go 模块缓存里的 .lock 天生是 0 字节，必须排除
          EMPTY=$(find dl -type f -size 0 ! -path 'dl/go-mod-cache/*' ! -name '*.lock' 2>/dev/null || true)
          if [ -n "$EMPTY" ]; then
            echo "::warning::发现 0 字节文件（可能是下载残留，请留意）："
            echo "$EMPTY"
          fi

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          set -o pipefail
          if make -j$(nproc) 2>&1 | tee ../build.log; then
            exit 0
          fi

          #失败包的错误不在控制台，先打包级日志，没有日志再串行重编一次
          #只提取可靠的 package/... failed 格式（可作为 make target），全部列出
          FAILED=$(sed -n -E 's#.*ERROR: (package/[^ ]+) failed to build.*#\1#p' ../build.log | sort -u | head -20 || true)
          echo "failed package(s): ${FAILED:-<unknown>}"
          if [ -n "${FAILED:-}" ]; then
            for pkg in $FAILED; do
              LOGS=$(find "logs/$pkg" -name '*.txt' 2>/dev/null || true)
              if [ -n "$LOGS" ]; then
                for f in $LOGS; do
                  echo "::group::$f"
                  tail -n 80 "$f"
                  echo "::endgroup::"
                done
              else
                echo "::group::$pkg 串行重编"
                make -j1 V=s "$pkg/compile" 2>&1 | tail -n 150 || true
                echo "::endgroup::"
              fi
            done
          else
            #兜底：无法定位失败包时输出 build.log 尾部与所有编译日志
            #（make[3]: *** [...] Error 1 这类失败走这里，诊断信息在日志中）
            echo "::group::build.log 尾部（未能定位失败包）"
            tail -n 200 ../build.log || true
            echo "::endgroup::"
            for f in $(find logs -name 'compile.txt' -type f 2>/dev/null); do
              echo "::group::$f"
              tail -n 60 "$f"
              echo "::endgroup::"
            done
          fi
          exit 1

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.WRT_CONFIG }}-${{ env.WRT_DATE }}
          path: |
            build.log
            wrt/logs/
            wrt/.config
          retention-days: 7
          if-no-files-found: warn
          #wrt/.config 是隐藏文件，默认不会被收集
          include-hidden-files: true

      - name: Prune Stale Caches
        #成功才清理；正在复用的那份不删
        if: ${{ success() && env.WRT_TEST != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DL_HIT: ${{ steps.cache-dl.outputs.cache-hit }}
          TC_HIT: ${{ steps.cache-toolchain.outputs.cache-hit }}
          TG_HIT: ${{ steps.cache-target.outputs.cache-hit }}
        run: |
          prune() {
            echo "== prune caches with prefix: $1 =="
            gh cache list --key "$1" --limit 100 --json id,key --jq '.[] | "\(.id)\t\(.key)"' \
              | while IFS=$'\t' read -r ID KEY; do
                  [ -n "$ID" ] || continue
                  echo "delete cache: $KEY ($ID)"
                  gh cache delete "$ID" || true
                done
          }

          [ "$DL_HIT" = 'true' ] || prune "dl-$WRT_ARCH-"
          prune "ccache-$WRT_ARCH-$WRT_TARGET-"
          [ "$TC_HIT" = 'true' ] || prune "toolchain-$WRT_ARCH-$WRT_TARGET-$WRT_BRANCH-"
          [ "$TG_HIT" = 'true' ] || prune "$WRT_ARCH-$WRT_TARGET-$WRT_BRANCH-$WRT_CONFIG-"

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="
          echo "=== cache sizes ==="
          du -sh ./dl ./.ccache ./staging_dir ./build_dir 2>/dev/null || true
          echo "=== ccache stats ==="
          ccache -s 2>/dev/null | head -20 || true

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          {
            echo "repo:    $WRT_REPO"
            echo "branch:  $WRT_BRANCH"
            echo "commit:  ${WRT_HASH:-unknown}"
            echo "config:  $WRT_CONFIG"
            echo "target:  $WRT_TARGET"
            echo "date:    $WRT_DATE"
          } > ./upload/BUILD-INFO.txt

          if [ -f ../packages.lock ]; then
            cp -f ../packages.lock ./upload/packages.lock
          fi

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            (
              cd ./upload
              for f in *; do
                [ "$f" = "sha256sums" ] && continue
                [ -f "$f" ] && sha256sum "$f"
              done > sha256sums
            )
          fi

      - name: Release Firmware
        if: env.WRT_TEST != 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{env.CI_NAME}}-${{env.WRT_CONFIG}}_${{env.WRT_DATE}}
          files: ./wrt/upload/*
          body: |
            本固件只包含 Config 中显式选中的设备，请按文件名选择对应设备！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

            附件说明：
            - sha256sums：上传目录内各文件的校验和（改名后重新生成）
            - packages.lock：本次构建所有第三方插件的 commit
            - BUILD-INFO.txt：构建来源（源码/分支/commit/配置/时间）
