name: QCA-6.18-VIKINGYFY

on:
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
#        CONFIG: [IPQ807X-NOWIFI, IPQ807X-WIFI,IPQ60XX-NOWIFI, IPQ60XX-WIFI]
        CONFIG: [IPQ60XX-NOWIFI]
        SOURCE: [VIKINGYFY/immortalwrt]
#        SOURCE: [davidtall/immortalwrt]
        BRANCH: [main]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{matrix.CONFIG}}
      WRT_THEME: argon
      WRT_NAME: DAE-WRT
      WRT_SSID: DAE-WRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      # 仅作提示，改这个值不会影响实际登录密码
      WRT_PW: 无
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      WRT_BRANCH: ${{matrix.BRANCH}}
      WRT_SOURCE: ${{matrix.SOURCE}}
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #workflow_run 触发时 inputs 为空，必须显式转布尔，否则传 '' 会报 Unexpected value
      WRT_TEST: ${{inputs.TEST == true}}

      CI_NAME: ${{github.workflow}}
